<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>VoRush 音频测试</title>
    <style>
      body {
        font-family: sans-serif;
        background: #2c3e50;
        color: #fff;
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 40px 20px;
        gap: 20px;
      }
      button {
        font-size: 28px;
        padding: 24px 48px;
        border-radius: 16px;
        border: none;
        background: #27ae60;
        color: #fff;
        min-width: 320px;
        min-height: 80px;
      }
      #log {
        background: #1a252f;
        padding: 16px;
        border-radius: 8px;
        width: 90%;
        max-width: 640px;
        font-size: 18px;
        white-space: pre-wrap;
        min-height: 200px;
      }
    </style>
  </head>
  <body>
    <h1>音频测试</h1>
    <button id="btn-speech">🔊 测试语音（应听到 cat）</button>
    <button id="btn-tone">🎵 测试音效（应听到叮）</button>
    <div id="log">等待点击…</div>
    <script>
      const log = (msg) => {
        document.getElementById('log').textContent += '\n' + msg;
      };

      let ctx = null;
      document.getElementById('btn-speech').addEventListener('click', () => {
        try {
          const synth = window.speechSynthesis;
          if (!synth) {
            log('❌ 此浏览器不支持 speechSynthesis');
            return;
          }
          synth.cancel();
          const u = new SpeechSynthesisUtterance('cat');
          u.lang = 'en-US';
          u.volume = 1;
          u.rate = 0.8;
          u.onstart = () => log('✅ 语音开始播放');
          u.onerror = (e) => log('❌ 语音播放错误: ' + e.error);
          setTimeout(() => synth.speak(u), 60);
          log('已调用 speak(cat)，voices=' + synth.getVoices().length);
        } catch (e) {
          log('❌ 语音异常: ' + e.message);
        }
      });

      document.getElementById('btn-tone').addEventListener('click', () => {
        try {
          const AC = window.AudioContext || window.webkitAudioContext;
          if (!AC) {
            log('❌ 此浏览器不支持 AudioContext');
            return;
          }
          if (!ctx) ctx = new AC();
          ctx.resume().then(() => {
            log('AudioContext 状态: ' + ctx.state);
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.frequency.value = 784;
            gain.gain.value = 0.2;
            osc.connect(gain).connect(ctx.destination);
            osc.start();
            osc.stop(ctx.currentTime + 0.3);
            log('✅ 已播放振荡器音');
          });
        } catch (e) {
          log('❌ 音效异常: ' + e.message);
        }
      });

      log('页面加载完成。mediaDevices=' + !!navigator.mediaDevices);
    </script>
  </body>
</html>
